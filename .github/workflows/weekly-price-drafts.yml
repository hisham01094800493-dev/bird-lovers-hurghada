name: Weekly bird price drafts

on:
  # GitHub cron is UTC. These entries cover Cairo UTC+2 and UTC+3.
  # The endpoint checks Africa/Cairo and only runs at Wednesday 01:00 local time.
  schedule:
    - cron: "0 22 * * 2"
    - cron: "0 23 * * 2"
  workflow_dispatch:
    inputs:
      run_now:
        description: "Create a price draft now (manual, authenticated)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect-price-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a pending price draft
        env:
          PRICE_REFRESH_SECRET: ${{ secrets.PRICE_REFRESH_SECRET }}
          PRICE_REFRESH_BASE_URL: https://bird-lovers-hurghada-production-536a.up.railway.app
          RUN_NOW: ${{ inputs.run_now || false }}
        run: |
          set -euo pipefail
          if [ -z "$PRICE_REFRESH_SECRET" ]; then
            echo "Missing repository secret PRICE_REFRESH_SECRET" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -X POST "$PRICE_REFRESH_BASE_URL/api/scheduled/price-guide-refresh" \
            -H "x-price-refresh-secret: $PRICE_REFRESH_SECRET" \
            -H "x-price-refresh-run-now: $RUN_NOW" \
            -H "accept: application/json"
          echo
