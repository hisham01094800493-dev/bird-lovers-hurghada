name: Weekly bird price drafts

on:
  # The canonical Friday 17:00 Africa/Cairo schedule is managed in Manus.
  # This workflow remains a guarded fallback and the endpoint enforces its own window.
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:
    inputs:
      run_now:
        description: "Create a price draft now (manual, authenticated)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect-price-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a pending price draft
        env:
          PRICE_REFRESH_SECRET: ${{ secrets.PRICE_REFRESH_SECRET }}
          PRICE_REFRESH_BASE_URL: https://bird-lovers-hurghada.vercel.app
          RUN_NOW: ${{ inputs.run_now || false }}
        run: |
          set -euo pipefail
          if [ -z "$PRICE_REFRESH_SECRET" ]; then
            echo "Missing repository secret PRICE_REFRESH_SECRET" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -X POST "$PRICE_REFRESH_BASE_URL/api/scheduled/price-guide-refresh" \
            -H "x-price-refresh-secret: $PRICE_REFRESH_SECRET" \
            -H "x-price-refresh-run-now: $RUN_NOW" \
            -H "accept: application/json"
          echo
