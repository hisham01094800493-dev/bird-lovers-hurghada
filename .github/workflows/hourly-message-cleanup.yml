name: Hourly message attachment cleanup

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove expired message attachments
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://bird-lovers-hurghada.vercel.app
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$BASE_URL/api/scheduled/message-attachments-cleanup" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "accept: application/json"
          echo
